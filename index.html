<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All seeing eye</title>
  
  <!-- ARG Clues & Metadata -->
  <meta name="clue-frequency" content="142.857 MHz">
  <meta name="tape-date" content="2008-11-04">
  <meta name="coordinates" content="37.2431 N, 115.7930 W">
  <meta name="hint" content="What Occult Freak is going through">
  <meta name="description" content="All seeing eye. Archive 2008.">

  <!-- Gritty 2008 Typewriter & Retro Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
  
  <!-- External stylesheet link + INLINE STYLES to prevent any browser caching issues -->
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    /* =============================================================================
       EASY BACKGROUND CONFIGURATION:
       To change background image, edit '--bg-image' below!
       ============================================================================= */
    :root {
      --bg-image: url('assets/bg-horror.jpg');
      --bg-opacity: 0.55;
      --bg-darkness: 0.70;
      --color-black: #040405;
      --color-text-white: #e5e5e0;
      --color-text-dim: #888890;
      --color-blood-red: #cc1b1b;
      --color-night-vision: #7cd986;
      --font-typewriter: 'Special Elite', 'Courier Prime', 'Courier New', monospace;
      --font-mono: 'Courier Prime', 'Courier New', monospace;
      --font-hud: 'VT323', 'Courier New', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-color: var(--color-black);
      color: var(--color-text-white);
      font-family: var(--font-mono);
      overflow: hidden;
      position: relative;
    }

    /* Background Layer */
    .bg-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #08080c;
      background-image: var(--bg-image), radial-gradient(circle at 50% 35%, #1c1d22 0%, #0d0e12 50%, #030305 95%);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: var(--bg-opacity);
      filter: contrast(130%) grayscale(60%);
      z-index: 0;
      pointer-events: none !important;
    }

    /* Vignette Overlay */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(4, 4, 5, 0.45) 0%, rgba(4, 4, 5, var(--bg-darkness)) 65%, rgba(0, 0, 0, 0.98) 100%);
      z-index: 1;
      pointer-events: none !important;
    }

    /* Animated Static Noise Canvas */
    .noise-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0.16;
      mix-blend-mode: screen;
      z-index: 2;
      pointer-events: none !important;
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.45) 3px,
        rgba(0, 0, 0, 0.45) 4px
      );
      opacity: 0.65;
      z-index: 3;
      pointer-events: none !important;
    }

    /* Top HUD */
    .hud-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 100;
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.8rem;
      font-family: var(--font-hud);
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      color: var(--color-text-white);
      text-shadow: 1px 1px 2px #000;
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff1111;
      box-shadow: 0 0 6px #ff1111;
      animation: recFlash 1.6s steps(2, start) infinite;
    }

    @keyframes recFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hud-btn {
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    .hud-btn:hover {
      color: #fff;
      border-color: #999;
      background: rgba(255, 255, 255, 0.08);
    }

    /* =============================================================================
       DEAD CENTER HERO HORROR CONTAINER
       Positioned with absolute 50%/50% translate(-50%, -50%) for perfect centering!
       ============================================================================= */
    .horror-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 440px;
      z-index: 100;
      pointer-events: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    /* Eye Emblem */
    .eye-symbol {
      margin-bottom: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0.85;
    }

    .eye-svg {
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.3));
    }

    .eye-shape {
      fill: #08080a;
      stroke: #bbb;
      stroke-width: 2.2;
    }

    .iris-circle {
      fill: #18181e;
      stroke: #777;
      stroke-width: 1.2;
    }

    .pupil-circle {
      fill: #000;
      stroke: #222;
      stroke-width: 1;
    }

    .glint-circle {
      fill: #fff;
      opacity: 0.7;
    }

    /* Mandatory Header: "All seeing eye" */
    .horror-title {
      font-family: var(--font-typewriter);
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--color-text-white);
      text-transform: lowercase;
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.9), -1px -1px 0 rgba(0,0,0,0.8);
      margin-bottom: 1.6rem;
      user-select: none;
    }

    /* Centered Simple Password Form */
    .simple-password-form {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 1.4rem auto;
      position: relative;
      z-index: 101;
    }

    .input-box-row {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #444448;
      padding: 0.45rem 0.65rem;
      transition: border-color 0.25s;
    }

    .input-box-row:focus-within {
      border-color: #9999aa;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.18);
    }

    .prompt-arrow {
      color: #888;
      font-family: var(--font-mono);
      font-size: 1.1rem;
      margin-right: 0.6rem;
      user-select: none;
    }

    .simple-password-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 1rem;
      letter-spacing: 0.08em;
      padding: 0.3rem 0;
      min-width: 0;
      cursor: text;
    }

    .simple-password-input::placeholder {
      color: #55555c;
      font-style: italic;
      font-size: 0.88rem;
    }

    .simple-submit-btn {
      background: transparent;
      border: none;
      color: #888;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      transition: color 0.2s;
    }

    .simple-submit-btn:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* Output & Hint Log */
    .output-log {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.5;
    }

    .log-line {
      margin-bottom: 0.35rem;
      word-break: break-word;
    }

    .log-line.init, .log-line.clue {
      color: #9ab4d0;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #3a3d45;
      padding: 0.4rem 0.65rem;
      display: inline-block;
      margin-top: 0.2rem;
    }

    .log-line.error {
      color: var(--color-blood-red);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .log-line.success {
      color: var(--color-night-vision);
      font-weight: 700;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #2e5a32;
      padding: 0.5rem 0.8rem;
      display: inline-block;
    }

    .glitch-active {
      animation: vhsGlitch 0.35s ease-in-out;
    }

    @keyframes vhsGlitch {
      0% { transform: translate(-50%, -50%); }
      20% { transform: translate(calc(-50% - 4px), calc(-50% + 2px)); filter: contrast(160%); }
      40% { transform: translate(calc(-50% + 4px), calc(-50% - 2px)); }
      60% { transform: translate(calc(-50% - 2px), calc(-50% - 1px)); }
      80% { transform: translate(calc(-50% + 2px), calc(-50% + 1px)); }
      100% { transform: translate(-50%, -50%); }
    }

    /* Bottom HUD */
    .hud-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 1.8rem;
      font-family: var(--font-hud);
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      color: var(--color-text-dim);
      text-shadow: 1px 1px 2px #000;
      user-select: none;
    }

    @media (max-width: 600px) {
      .hud-top, .hud-bottom {
        padding: 0.8rem 1rem;
        font-size: 1.05rem;
      }
      .horror-title {
        font-size: 1.85rem;
      }
    }
  </style>
</head>
<body>
  <!-- Background & Visual Overlays -->
  <div id="bg-layer" class="bg-layer" aria-hidden="true"></div>
  <div class="vignette-overlay" aria-hidden="true"></div>
  <canvas id="noise-canvas" class="noise-canvas" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- 2008 Camcorder HUD Top -->
  <header class="hud-top">
    <div class="rec-indicator">
      <span class="rec-dot"></span>
      <span class="rec-text">REC [00:04:18]</span>
    </div>
    <div class="tape-meta">
      <button id="sound-btn" class="hud-btn" type="button" onclick="window.toggleAudio && window.toggleAudio()" title="Toggle audio">[ audio: muted ]</button>
    </div>
  </header>

  <!-- Centered Hero Horror Container (Positioned Dead Center with top: 50%, left: 50%, transform: translate(-50%, -50%)) -->
  <main class="horror-container">
    
    <!-- Unsettling Staring Eye Glyph -->
    <div class="eye-symbol" id="eye-container" aria-hidden="true">
      <svg viewBox="0 0 120 70" width="110" height="65" class="eye-svg">
        <path d="M 10 35 Q 60 5 110 35 Q 60 65 10 35 Z" class="eye-shape" />
        <g id="pupil-group">
          <circle cx="60" cy="35" r="15" class="iris-circle" />
          <circle cx="60" cy="35" r="7" class="pupil-circle" />
          <circle cx="58" cy="33" r="2" class="glint-circle" />
        </g>
      </svg>
    </div>

    <!-- Mandatory Text: "All seeing eye" -->
    <h1 class="horror-title" id="horror-title">All seeing eye</h1>

    <!-- Simple Centered Password Form -->
    <form id="password-form" class="simple-password-form" onsubmit="window.submitPassword && window.submitPassword(); return false;" autocomplete="off" spellcheck="false">
      <div class="input-box-row">
        <span class="prompt-arrow">&gt;</span>
        <input 
          type="text" 
          id="password-input" 
          name="cipher"
          class="simple-password-input" 
          placeholder="enter password..." 
          autocomplete="off" 
          autocapitalize="off" 
          autofocus 
          required 
        />
        <button type="submit" id="submit-btn" class="simple-submit-btn" onclick="window.submitPassword && window.submitPassword()">[ submit ]</button>
      </div>
    </form>

    <!-- Raw Terminal Response & Active Hint -->
    <div id="output-log" class="output-log" aria-live="polite">
      <div class="log-line init">&gt; hint: What Occult Freak is going through</div>
    </div>

  </main>

  <!-- VHS Tracking Bottom Timestamp -->
  <footer class="hud-bottom">
    <span class="vhs-timestamp" id="vhs-timestamp">2008-11-04 03:14:21 AM</span>
    <span class="vhs-sp">SP // NTSC</span>
  </footer>

  <!-- External script link + INLINE SCRIPT to guarantee zero caching issues -->
  <script src="script.js?v=3"></script>
  <script>
    /* =============================================================================
       INLINE SCRIPT TO ENSURE INSTANT EXECUTION (Immune to Browser Caching)
       ============================================================================= */
    const ARG_CONFIG = {
      hint: "What Occult Freak is going through",
      passwords: {
        "splitpersonality": {
          title: "ACCESS GRANTED",
          message: "The fracture is recognized. Two minds, one vessel.",
          clue: "Archive unlocked: 'What Occult Freak is going through.' The other side has awakened."
        }
      },
      errorMessages: [
        "access denied.",
        "invalid cipher key.",
        "tape sequence corrupted.",
        "nothing here.",
        "the eye is closed."
      ]
    };

    // Safe Noise Canvas Loop
    (function initNoise() {
      try {
        const canvas = document.getElementById("noise-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        function resize() {
          canvas.width = window.innerWidth || 800;
          canvas.height = window.innerHeight || 600;
        }
        window.addEventListener("resize", resize);
        resize();

        const gw = 160, gh = 100;
        const off = document.createElement("canvas");
        off.width = gw; off.height = gh;
        const offCtx = off.getContext("2d");
        const img = offCtx.createImageData(gw, gh);
        const d = img.data;

        let last = 0;
        function loop(t) {
          requestAnimationFrame(loop);
          if (t - last < 45) return;
          last = t;
          for (let i = 0; i < d.length; i += 4) {
            const v = (Math.random() * 255) | 0;
            d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
          }
          offCtx.putImageData(img, 0, 0);
          if (canvas.width > 0 && canvas.height > 0) {
            ctx.imageSmoothingEnabled = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
          }
        }
        requestAnimationFrame(loop);
      } catch (e) {}
    })();

    // Simple Audio Synthesizer
    let audioCtx = null;
    let audioEnabled = false;
    let hissNode = null;

    window.toggleAudio = function() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        audioEnabled = !audioEnabled;

        const btn = document.getElementById("sound-btn");
        if (btn) {
          btn.textContent = audioEnabled ? "[ audio: on ]" : "[ audio: muted ]";
          btn.style.color = audioEnabled ? "#7cd986" : "";
        }

        if (audioEnabled && audioCtx) {
          // Play a small tone
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.frequency.value = 320;
          g.gain.setValueAtTime(0.04, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
      } catch (e) {}
    };

    function playClick() {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.03);
        g.gain.setValueAtTime(0.04, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.035);
      } catch (e) {}
    }

    function playDenial() {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(90, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(45, audioCtx.currentTime + 0.3);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.32);
      } catch (e) {}
    }

    function playSuccess() {
      if (!audioEnabled || !audioCtx) return;
      try {
        [164.81, 196.00, 246.94].forEach(f => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          g.gain.setValueAtTime(0.001, audioCtx.currentTime);
          g.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.1);
          g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.0);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 2.1);
        });
      } catch (e) {}
    }

    // Password Check Handler
    window.submitPassword = function() {
      const input = document.getElementById("password-input");
      const output = document.getElementById("output-log");
      const container = document.querySelector(".horror-container");

      if (!input || !output) return;
      const rawVal = input.value.trim();

      if (!rawVal) {
        output.innerHTML = '<div class="log-line error">&gt; enter a password.</div>';
        input.focus();
        return;
      }

      playClick();
      const val = rawVal.toLowerCase();
      const match = ARG_CONFIG.passwords[val];
      output.innerHTML = "";

      if (match) {
        // ACCESS GRANTED
        playSuccess();

        const lineTitle = document.createElement("div");
        lineTitle.className = "log-line success";
        lineTitle.textContent = `> ${match.title}`;
        output.appendChild(lineTitle);

        const lineMsg = document.createElement("div");
        lineMsg.className = "log-line";
        lineMsg.textContent = match.message;
        output.appendChild(lineMsg);

        if (match.clue) {
          const lineClue = document.createElement("div");
          lineClue.className = "log-line clue";
          lineClue.textContent = match.clue;
          output.appendChild(lineClue);
        }
      } else {
        // ACCESS DENIED
        playDenial();

        if (container) {
          container.classList.remove("glitch-active");
          void container.offsetWidth;
          container.classList.add("glitch-active");
        }

        const randomErr = ARG_CONFIG.errorMessages[
          Math.floor(Math.random() * ARG_CONFIG.errorMessages.length)
        ];

        const errLine = document.createElement("div");
        errLine.className = "log-line error";
        errLine.textContent = `> ${randomErr}`;
        output.appendChild(errLine);

        const hintLine = document.createElement("div");
        hintLine.className = "log-line clue";
        hintLine.textContent = `hint: ${ARG_CONFIG.hint}`;
        output.appendChild(hintLine);
      }

      input.value = "";
      input.focus();
    };

    // Eye Tracking Cursor
    (function initEye() {
      const pupil = document.getElementById("pupil-group");
      const eye = document.getElementById("eye-container");
      if (!pupil || !eye) return;

      window.addEventListener("mousemove", e => {
        const r = eye.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        const a = Math.atan2(dy, dx);
        const d = Math.min(6, Math.hypot(dx, dy) / 25);
        pupil.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
      });
    })();

    // Input keystroke sound
    const inp = document.getElementById("password-input");
    if (inp) {
      inp.addEventListener("input", playClick);
    }

    console.log("[2008 ARCHIVE] Password: 'SplitPersonality' // Hint: 'What Occult Freak is going through'");
  </script>
</body>
</html>
